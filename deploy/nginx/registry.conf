# =====================================================================
#  Реестр научных проектов Южного университета (ИУБиП)
#  Размещение по п.3.2 ТЗ: science.iubip.ru, доступ по HTTPS,
#  база данных и служебные интерфейсы в сеть Интернет не публикуются.
#
#  Установка:
#    1) получить сертификат: certbot certonly --nginx -d science.iubip.ru
#    2) подставить путь к сертификату в ssl_certificate (ниже)
#    3) скопировать в /etc/nginx/sites-available/ и включить:
#         ln -s /etc/nginx/sites-available/registry.conf \
#               /etc/nginx/sites-enabled/registry.conf
#    4) nginx -t && systemctl reload nginx
#
#  Установленное имя сервера и канонический домен — на согласовании
#  (вопрос 2 ТЗ), поэтому пример использует science.iubip.ru.
# =====================================================================

# Канонический домен и его www-вариант
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Ограничение частоты публичного API (FR-33): 60 запросов в минуту с адреса.
# Дублирует ограничение приложения, но срабатывает раньше — до обращения к БД.
limit_req_zone $binary_remote_addr zone=registry_public:10m rate=60r/m;

# Защита от подбора пароля на закрытой зоне.
limit_req_zone $binary_remote_addr zone=registry_auth:10m rate=10r/m;

upstream registry_app {
    # Приложение слушает только локально и наружу не публикуется (п.3.2 п.3)
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name science.iubip.ru;

    # ACME-челлендж для продления сертификата
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # SEC-01: только HTTPS. Незащищённое соединение перенаправляется.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name science.iubip.ru;

    # ---------- TLS ----------
    # Путь выдаётся certbot; заменить при выпуске сертификата.
    ssl_certificate     /etc/letsencrypt/live/science.iubip.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/science.iubip.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP ограничивает исполнение постороннего кода (SEC-04).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 25m;      # FR-21, согласуется с UPLOAD_MAX_BYTES
    client_body_timeout 30s;

    access_log /var/log/nginx/registry.access.log;
    error_log  /var/log/nginx/registry.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- Публичный API только для чтения ----------
    location /api/public/ {
        limit_req zone=registry_public burst=20 nodelay;
        limit_req_status 429;

        # CORS для официального сайта задаётся переменной PUBLIC_ALLOWED_ORIGINS
        # в .env; конкретные домены проставляются через add_header ниже.
        add_header Access-Control-Allow-Origin "https://iubip.ru" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Request-Id" always;

        proxy_pass http://registry_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- Вход в закрытую зону ----------
    location = /api/auth/login {
        limit_req zone=registry_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://registry_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Служебный API (документация) ----------
    location = /api/docs      { proxy_pass http://registry_app; include /etc/nginx/snippets/registry-proxy.conf; }
    location = /api/openapi.json { proxy_pass http://registry_app; include /etc/nginx/snippets/registry-proxy.conf; }

    # ---------- Остальное API закрытой зоны ----------
    location /api/ {
        # Присутствие авторизации проверяет приложение; здесь запрещаем кэш
        # и принудительно разрываем соединение при закрытии клиента.
        proxy_pass http://registry_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ---------- Интерфейс ----------
    location /assets/ {
        # Содержимое сборки меняется по содержимому-хешу в имени файла
        proxy_pass http://registry_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://registry_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Запрет доступа к базе и служебным каталогам, если они случайно окажутся
# в корне сайта. Публичный доступ к БД запрещён п.3.1 и п.3.2.
location ~* ^/(data|storage|backups|\.git|\.env|backend)/ {
    deny all;
    return 404;
}